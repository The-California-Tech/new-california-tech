name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # App: does it type-check, lint, and actually build from a CLEAN CLONE?
  #
  # The clean-clone part matters more than it sounds. `static/` and
  # `src/generated/` are gitignored and regenerated by `build:QWER`, and until
  # recently two brand assets (tech.svg, tech-eclipse.webp) existed only on one
  # laptop -- a git-based build shipped without the masthead and nothing caught
  # it. This job is that check.
  # ---------------------------------------------------------------------------
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Uses the committed lockfile, so this also verifies that the pinned
      # symbiont-cms git tag installs cleanly -- the failure mode that blocked
      # deploys for weeks (a tag with no dist/, and a nested install that could
      # not run its build scripts).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Lint
        run: pnpm lint
        continue-on-error: true # advisory for now; drop this once lint is clean

      - name: Build
        run: pnpm build
        env:
          # Placeholders only. Nothing here is secret and nothing reaches a real
          # service: the build must not need live credentials. If a change makes
          # the build require a real value, that is the bug -- symbiont reads env
          # lazily inside request handlers precisely so this stays true.
          CRON_SECRET: ci-placeholder
          NOTION_TOKEN: ci-placeholder
          NOTION_WEBHOOK_SECRET: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

      # Guards the class of bug where an asset exists locally but was never
      # committed, so the deployed site 404s it.
      - name: Verify generated static assets exist
        run: |
          set -euo pipefail
          missing=0
          for f in static/favicon.png static/robots.txt static/tech.svg; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing after build on a clean clone"
              missing=1
            else
              echo "ok  $f"
            fi
          done
          exit $missing

  # ---------------------------------------------------------------------------
  # Database: migrations apply from scratch, behavioural checks pass, and the
  # declarative schema still agrees with the migrations.
  #
  # feed_sql_checks.sql is the real guard for privileges. `db diff` is blind to
  # GRANT/REVOKE (its model is additive), so it cannot catch an anon role that
  # regained TRUNCATE -- it reports "No schema changes found" either way. The two
  # steps check different things; keep both.
  # ---------------------------------------------------------------------------
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      # Applies every migration to an empty database, in order. Catches
      # ordering bugs -- e.g. the default-privileges migration must sort ahead of
      # the baseline, because ALTER DEFAULT PRIVILEGES only affects objects
      # created after it runs.
      - name: Apply migrations from scratch
        run: supabase db reset

      - name: Run SQL checks
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/feed_sql_checks.sql

      - name: Declarative schema matches migrations
        run: |
          set -euo pipefail
          out="$(supabase db diff -f ci_drift_probe 2>&1)"
          echo "$out"
          if echo "$out" | grep -q "No schema changes found"; then
            echo "schemas/ and migrations/ agree"
            exit 0
          fi
          echo "::error::supabase/schemas/ has drifted from supabase/migrations/."
          echo "::error::Generated migration below. Do NOT apply it blindly -- the"
          echo "::error::diff engine drops view reloptions and cannot express REVOKE."
          cat supabase/migrations/*ci_drift_probe.sql || true
          exit 1
