# Committed, and deliberately contains NO `overrides:` block.
#
# This file used to be untracked and also carried:
#
#   overrides:
#     symbiont-cms: link:../../shenanigans/symbiont-cms
#
# which was load-bearing for local development but fatal in CI (the path does
# not exist on Vercel) and, worse, rewrote pnpm-lock.yaml so the committed
# lockfile no longer resolved the pinned git tag. Because `allowBuilds` and the
# dev override lived in the same gitignored file, keeping the override out of
# git also kept `allowBuilds` out of production.
#
# They are now separated. `allowBuilds` lives here and ships. Local development
# against a symbiont-cms checkout uses `pnpm run symbiont:link`, which swaps the
# node_modules symlink directly and never touches pnpm config or the lockfile.
# See scripts/symbiont-link.sh.
#
# ---------------------------------------------------------------------------
# THE symbiont-cms ENTRY IS REQUIRED, and not for the reason you might expect.
#
# pnpm gates build scripts for GIT-HOSTED dependencies categorically -- it is
# not conditional on the package actually having a lifecycle script. v1.1.9
# dropped symbiont-cms's `prepare` script entirely (it was `svelte-kit sync`),
# and pnpm still refuses to install without approval:
#
#   ERR_PNPM_IGNORED_BUILDS: Ignored build scripts:
#     symbiont-cms@https://codeload.github.com/.../tar.gz/<sha>
#
# So this cannot be removed by making the package build-free. Tested: it can't.
#
# KEY FORMAT MATTERS. `allowBuilds` matches registry packages by bare name, but
# git-hosted ones by `name@resolution` -- a bare `symbiont-cms: true` silently
# matches nothing. pnpm's own error message suggests a commit-pinned codeload
# URL, which would need editing on every single release; since pnpm 11.19 the
# *repository* form below also approves the package when pnpm downloads a
# tarball rather than cloning, so it survives retagging. See pnpm/pnpm#12367.
#
# If pnpm ever rewrites this file with a commit-pinned URL and the placeholder
# value `set this to true or false` (it does that when it hits the error),
# replace it with the repository form below rather than accepting the pin.
# ---------------------------------------------------------------------------
allowBuilds:
  symbiont-cms@git+https://github.com/guutz/symbiont-cms.git: true
  svelte-preprocess: true
  '@parcel/watcher': false
  esbuild: false
  sharp: false
  workerd: false
minimumReleaseAgeExclude:
  - katex@0.18.7
